# Render Blueprint Specification for SecureVault X
# https://render.com/docs/blueprint-spec

services:
  # Containerized Production Web Service (FastAPI + Embedded React Frontend)
  - type: web
    name: securevault-x
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: MAX_FILE_SIZE_BYTES
        value: 52428800
      - key: ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:5173,http://localhost:3000"
